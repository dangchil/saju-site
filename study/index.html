<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<link rel="icon" href="../images/mascot.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="../css/style.css?v=20261004.4">
<title>사주 공부 · 사주 노트</title>
</head>
<body data-tab="study">
<main class="app">
  <header class="topbar">
    <img class="mascot" data-mascot alt="" style="width:40px;height:40px">
    <h1>사주 공부</h1>
  </header>
  <p class="muted" style="margin:0 4px 6px">사주 원리를 공부하면서 하나씩 정리해 올려요.</p>
  <ul class="post-list" id="list"></ul>
</main>
<script src="../js/common.js?v=20261004"></script>
<script>
// 글 목록은 study/posts.json 에서 읽습니다. (GitHub Pages가 study/posts/ 폴더를 보고 자동으로 만듭니다)
// 글이 3편보다 적으면 남은 자리를 빈 칸으로 보여 줍니다.
var MIN_SLOTS = 3;
var COLORS = ["var(--apricot)", "var(--mint)", "var(--sky)", "var(--lilac)", "var(--butter)"];
fetch("posts.json", { cache: "no-cache" })
  .then(function (r) { return r.json(); })
  .catch(function () { return []; })
  .then(function (posts) {
    var ul = document.getElementById("list");
    var n = Math.max(MIN_SLOTS, posts.length);
    for (var i = 0; i < n; i++) {
      var li = document.createElement("li");
      var p = posts[i];
      if (p) {
        var a = document.createElement("a");
        a.href = p.url;
        a.style.background = COLORS[i % COLORS.length];
        a.innerHTML = '<span class="num">' + (i + 1) + '</span><span style="flex:1"></span>' + Site.icon("next");
        a.children[1].textContent = p.title;
        a.lastChild.style.cssText = "width:20px;height:20px;color:var(--ink-soft)";
        li.appendChild(a);
      } else {
        li.innerHTML = '<div class="empty pending" style="background:#fff"><span class="num">' + (i + 1) + '</span><span class="bar" aria-label="제목 자리"></span></div>';
      }
      ul.appendChild(li);
    }
  });
</script>
</body>
</html>
