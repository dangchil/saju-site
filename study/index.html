<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>사주 공부 · 사주 노트</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-tab="study">
<main class="app">
  <header class="topbar"><h1>사주 공부</h1></header>
  <section class="card">
    <h2>공부 글</h2>
    <p class="caption">사주 원리를 공부하면서 하나씩 정리해 올립니다.</p>
    <ul class="post-list" id="list"></ul>
  </section>
</main>
<script src="../js/common.js"></script>
<script>
// 글 목록은 study/posts.json 에서 읽습니다. (GitHub Pages가 study/posts/ 폴더를 보고 자동으로 만듭니다)
// 글이 3편보다 적으면 남은 자리를 빈 칸으로 보여 줍니다.
var MIN_SLOTS = 3;
fetch("posts.json", { cache: "no-cache" })
  .then(function (r) { return r.json(); })
  .catch(function () { return []; })
  .then(function (posts) {
    var ul = document.getElementById("list");
    var n = Math.max(MIN_SLOTS, posts.length);
    for (var i = 0; i < n; i++) {
      var li = document.createElement("li");
      var p = posts[i];
      if (p) {
        var a = document.createElement("a");
        a.href = p.url;
        a.innerHTML = '<span class="num">' + (i + 1) + "</span><span></span>";
        a.lastChild.textContent = p.title;
        li.appendChild(a);
      } else {
        li.innerHTML = '<div class="empty reading pending"><span class="num">' + (i + 1) + '</span><span class="bar" aria-label="제목 자리"></span></div>';
      }
      ul.appendChild(li);
    }
  });
</script>
</body>
</html>
