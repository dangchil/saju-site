<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<link rel="icon" href="images/mascot.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261004">
<title>만세력 · 사주 노트</title>
</head>
<body data-tab="home">
<main class="app">
  <header class="topbar">
    <a class="icon-btn plain" href="index.html" aria-label="홈으로" data-icon="back"></a>
    <h1>만세력</h1>
  </header>

  <!-- 입력 -->
  <section class="card" id="formCard">
    <div class="error" id="errorBox" hidden></div>
    <form id="birthForm" autocomplete="off" novalidate>
      <span class="field-label" id="calLab">양력 · 음력</span>
      <div class="pills" role="radiogroup" aria-labelledby="calLab">
        <label class="pill"><input type="radio" name="cal" value="양력" checked>양력</label>
        <label class="pill"><input type="radio" name="cal" value="음력">음력</label>
        <label class="pill"><input type="radio" name="cal" value="윤달">음력 윤달</label>
      </div>

      <label class="field-label" for="bdate">생년월일</label>
      <input class="input" type="text" id="bdate" inputmode="numeric" maxlength="8" placeholder="예: 19900515">
      <div class="hint">8자리 숫자로 넣어 주세요 (연 4자리 · 월 2자리 · 일 2자리)</div>

      <label class="field-label" for="btime">태어난 시간</label>
      <div class="time-row">
        <input class="input" type="text" id="btime" inputmode="numeric" maxlength="4" placeholder="예: 0930">
        <label class="check"><input type="checkbox" id="noTime">시간 모름</label>
      </div>
      <div class="hint">24시간제 4자리입니다. 오후 6시 30분은 1830</div>

      <span class="field-label" id="genLab">성별</span>
      <div class="pills" role="radiogroup" aria-labelledby="genLab">
        <label class="pill"><input type="radio" name="gender" value="여">여자</label>
        <label class="pill"><input type="radio" name="gender" value="남">남자</label>
      </div>

      <button class="btn" type="submit">원국 보기</button>
    </form>
  </section>

  <!-- 결과 -->
  <div id="result" hidden>
    <section class="card">
      <div class="result-head">
        <img class="mascot" data-mascot alt="">
        <div>
          <div class="say" id="say"></div>
          <div class="sub" id="summary"></div>
        </div>
      </div>
      <table class="wonguk" id="natal"></table>
      <p class="saryeong-note" id="saryeongNote"></p>
    </section>

    <section class="card ohaeng">
      <h2>오행 분포</h2>
      <p class="caption" id="ohaengCap">원국 여덟 글자를 오행으로 나눠 센 것이에요.</p>
      <div id="ohaengBars"></div>
    </section>

    <section class="card">
      <h2>대운</h2>
      <p class="caption" id="daeunCaption"></p>
      <div class="strip" id="daeunStrip"></div>
      <h2 style="margin-top:14px">세운</h2>
      <p class="caption" id="seunCaption"></p>
      <div class="strip" id="seunStrip"></div>
    </section>

    <!-- 풀이: data/ 폴더의 파일에서 읽어 옵니다 -->
    <section class="card" id="ilganCard"></section>
    <section class="card">
      <h2>원국의 지지</h2>
      <div id="readJiji"></div>
    </section>
    <section class="card">
      <h2>원국에 있는 십성</h2>
      <div id="readSipsung"></div>
    </section>

    <button class="btn ghost" type="button" id="again">다시 입력하기</button>
  </div>
</main>

<script src="js/manse.js?v=20261004"></script>
<script src="js/saju-extra.js?v=20261004"></script>
<script src="js/common.js?v=20261004"></script>
<script>
var ORDER = ["시", "일", "월", "년"];
var DDI = ["쥐", "소", "호랑이", "토끼", "용", "뱀", "말", "양", "원숭이", "닭", "개", "돼지"];   // 자~해 순서의 띠 동물
var ELEM_NAME = ["목", "화", "토", "금", "수"], ELEM_HAN = ["木", "火", "土", "金", "水"];
var THIS_YEAR = todayKST().y;

function el(id) { return document.getElementById(id); }

// ---- 원국 표 ----
function renderNatal(natal, sar, timeUnknown) {
  function cellFor(l, fn) {
    if (timeUnknown && l === "시") return '<td class="sib">·</td>';
    return fn(l);
  }
  function row(fn) { return "<tr>" + ORDER.map(function (l) { return cellFor(l, fn); }).join("") + "</tr>"; }
  var dayCls = function (l) { return l === "일" ? ' class="day"' : ""; };
  var h = "<tr>" + ORDER.map(function (l) { return "<th>" + l + "주</th>"; }).join("") + "</tr>";
  h += row(function (l) { return '<td class="sib' + (l === "일" ? " day" : "") + '">' + natal[l].ten_stem + "</td>"; });
  h += row(function (l) {
    return "<td" + dayCls(l) + ">" + Site.chip(natal[l].stem_han, natal[l].stem_elem) + '<span class="ko">' + natal[l].stem_ko + "</span></td>";
  });
  h += row(function (l) {
    return "<td" + dayCls(l) + ">" + Site.chip(natal[l].branch_han, natal[l].branch_elem) + '<span class="ko">' + natal[l].branch_ko + "</span></td>";
  });
  h += row(function (l) { return '<td class="sib' + (l === "일" ? " day" : "") + '">' + natal[l].ten_branch + "</td>"; });
  h += row(function (l) {
    var chars = natal[l].hidden.split("");
    return "<td" + dayCls(l) + '><div class="row-label">지장간</div><span class="hidden-row">' + chars.map(function (ch, i) {
      var sar1 = l === "월" && i === sar.index;
      return '<span class="hj' + (sar1 ? ' saryeong" title="사령' : "") + '">' + ch + "</span>";
    }).join("") + "</span></td>";
  });
  h += row(function (l) { return '<td class="sib' + (l === "일" ? " day" : "") + '">' + natal[l].stage + "</td>"; });
  if (timeUnknown) {
    // 시간을 모르면 시주 칸의 제목만 남깁니다.
    h = h.replace("<th>시주</th>", "<th>시주<br><small>모름</small></th>");
  }
  el("natal").innerHTML = h;

  var day = Math.floor(sar.days) + 1;
  el("saryeongNote").innerHTML = "월지 지장간에서 <b>" + S_HA[sar.stem] + "</b> 글자가 사령이에요. " +
    sar.jeol + " 절입 후 " + day + "일째에 태어나 " + S_KO[sar.stem] + "(" + S_HA[sar.stem] + ")" +
    Site.josa(S_KO[sar.stem], "이", "가") + " 그달을 맡고 있어요.";
}

// ---- 오행 분포 ----
function renderOhaeng(natal, timeUnknown) {
  var cnt = [0, 0, 0, 0, 0], total = 0;
  ORDER.forEach(function (l) {
    if (timeUnknown && l === "시") return;
    cnt[natal[l].stem_elem]++; cnt[natal[l].branch_elem]++; total += 2;
  });
  el("ohaengCap").textContent = timeUnknown
    ? "시주를 뺀 원국 여섯 글자를 오행으로 나눠 센 것이에요."
    : "원국 여덟 글자(천간 넷, 지지 넷)를 오행으로 나눠 센 것이에요.";
  var COLORS = ["var(--mok)", "var(--hwa)", "var(--to)", "#B7BDC7", "var(--su)"];
  el("ohaengBars").innerHTML = cnt.map(function (c, i) {
    return '<div class="bar-row"><span class="name">' + ELEM_NAME[i] + "(" + ELEM_HAN[i] + ')</span>' +
      '<span class="track"><span class="fill" style="display:block;width:' + (c / total * 100) + "%;background:" + COLORS[i] + '"></span></span>' +
      '<span class="num">' + c + "</span></div>";
  }).join("");
}

// ---- 대운·세운 칸 하나 ----
function lunCard(o, top, opts) {
  opts = opts || {};
  var tag = opts.button ? "button" : "div";
  return "<" + tag + ' class="lun' + (opts.cls ? " " + opts.cls : "") + '"' +
    (opts.button ? ' type="button" data-idx="' + opts.idx + '" aria-pressed="false"' : "") + ">" +
    '<span class="top">' + top + "</span>" +
    '<span class="sib">' + o.ten_stem + "</span>" +
    Site.chip(o.stem_han, o.stem_elem) + Site.chip(o.branch_han, o.branch_elem) +
    '<span class="sib">' + o.ten_branch + "</span>" +
    (opts.now ? '<span class="now">' + opts.now + "</span>" : "") +
    "</" + tag + ">";
}

// 가로 띠 안에서 고른 칸이 가운데 오도록 옆으로만 밀어 줍니다 (화면 전체는 움직이지 않음).
function centerIn(strip, sel) {
  var cur = strip.querySelector(sel);
  if (!cur) return;
  var s = strip.getBoundingClientRect(), c = cur.getBoundingClientRect();
  strip.scrollLeft += (c.left + c.width / 2) - (s.left + s.width / 2);
}

var daeun = [];

function renderDaeun(data) {
  daeun = data.daeun;
  el("daeunCaption").textContent = data.direction + " · 대운수 " + data.daeun_num + " · 대운을 누르면 아래 세운이 바뀌어요";
  // 오른쪽에서 왼쪽으로: 첫 대운이 오른쪽 끝 (띠가 row-reverse 라 DOM 순서대로 넣으면 됩니다)
  el("daeunStrip").innerHTML = daeun.map(function (d, i) {
    return lunCard(d, d.age + "세", { button: true, idx: i });
  }).join("");
  var cur = 0;
  for (var i = 0; i < daeun.length; i++) if (daeun[i].year_from <= THIS_YEAR && THIS_YEAR <= daeun[i].year_to) cur = i;
  if (THIS_YEAR > daeun[daeun.length - 1].year_to) cur = daeun.length - 1;
  selectDaeun(cur);
}

function selectDaeun(idx) {
  var btns = el("daeunStrip").querySelectorAll(".lun");
  for (var i = 0; i < btns.length; i++) {
    var on = Number(btns[i].getAttribute("data-idx")) === idx;
    btns[i].classList.toggle("selected", on);
    btns[i].setAttribute("aria-pressed", on ? "true" : "false");
  }
  var d = daeun[idx];
  el("seunCaption").textContent = d.age + "세 대운 (" + d.year_from + "~" + d.year_to + "년) 안의 세운";
  el("seunStrip").innerHTML = d.seun.map(function (s) {
    var now = s.year === THIS_YEAR;
    return lunCard(s, s.year, { cls: now ? "this-year" : "", now: now ? "올해" : "" });
  }).join("");
  centerIn(el("daeunStrip"), ".lun.selected");
  centerIn(el("seunStrip"), ".lun.this-year");
}

el("daeunStrip").addEventListener("click", function (e) {
  var b = e.target.closest(".lun");
  if (b) selectDaeun(Number(b.getAttribute("data-idx")));
});

// ---- 풀이 (data/ 파일) ----
function renderReadings(natal, timeUnknown) {
  var ds = natal["일"];
  Site.loadData("ilgan").then(function (d) {
    var card = el("ilganCard"), text = Site.textOf(d, ds.stem_ko);
    card.innerHTML = "<h2>" + ds.stem_ko + " 일간 이야기</h2>";
    card.appendChild(Site.readingBlock(ds.stem_ko + "(" + ds.stem_han + ")" + ELEM_NAME[ds.stem_elem] + " 일간", text, "data/ilgan.json"));
  });
  var cols = ["년", "월", "일", "시"].filter(function (l) { return !(timeUnknown && l === "시"); });
  Site.loadData("jiji").then(function (d) {
    var box = el("readJiji"); box.innerHTML = "";
    cols.forEach(function (l) {
      var b = natal[l].branch_ko;
      // 띠는 태어난 해의 지지(년지)로만 정하므로 년지 제목에만 붙입니다.
      var title = l + "지 " + b + "(" + natal[l].branch_han + ")" + (l === "년" ? " · " + DDI[B_KO.indexOf(b)] + "띠" : "");
      box.appendChild(Site.readingBlock(title, Site.textOf(d, b), "data/jiji.json"));
    });
  });
  Site.loadData("sipsung").then(function (d) {
    var box = el("readSipsung"); box.innerHTML = "";
    var seen = [];
    cols.forEach(function (l) {
      [natal[l].ten_stem, natal[l].ten_branch].forEach(function (t) {
        if (t !== "일간" && seen.indexOf(t) < 0) seen.push(t);
      });
    });
    seen.sort(function (a, b) { return TEN.indexOf(a) - TEN.indexOf(b); });
    seen.forEach(function (t) { box.appendChild(Site.readingBlock(t, Site.textOf(d, t), "data/sipsung.json")); });
  });
}

// ---- 입력 처리 ----
function showError(msg) { el("errorBox").textContent = msg; el("errorBox").hidden = false; window.scrollTo(0, 0); }

function run(s) {
  var r;
  try { r = computeChart(s.birth12, s.cal, s.gender); } catch (err) { showError(err.message); return false; }
  var data = r.data, ds = data.natal["일"];
  el("say").textContent = "일간은 " + ds.stem_ko + "(" + ds.stem_han + ")" + ELEM_NAME[ds.stem_elem] +
    Site.josa(ELEM_NAME[ds.stem_elem], "이에요", "예요");
  el("summary").textContent = Site.birthLine(s) + (s.cal !== "양력" ? " → 양력 " + data.solar.slice(0, 10) : "") +
    (s.timeUnknown ? " · 계산은 낮 12시 기준" : "");
  renderNatal(data.natal, r.saryeong, s.timeUnknown);
  renderOhaeng(data.natal, s.timeUnknown);
  el("formCard").hidden = true;
  el("result").hidden = false;
  renderDaeun(data);   // 보이게 한 다음에 그려야 "지금" 칸을 가운데로 옮길 수 있습니다.
  renderReadings(data.natal, s.timeUnknown);
  window.scrollTo(0, 0);
  return true;
}

el("noTime").addEventListener("change", function () {
  el("btime").disabled = this.checked;
  if (this.checked) el("btime").value = "";
});

el("birthForm").addEventListener("submit", function (e) {
  e.preventDefault();
  el("errorBox").hidden = true;
  var date = el("bdate").value.replace(/\D/g, "");
  var noTime = el("noTime").checked;
  var time = noTime ? "1200" : el("btime").value.replace(/\D/g, "");
  var cal = document.querySelector('input[name="cal"]:checked').value;
  var g = document.querySelector('input[name="gender"]:checked');
  if (date.length !== 8) { showError("생년월일을 8자리 숫자로 넣어 주세요. 예: 19900515"); return; }
  if (time.length !== 4) { showError("태어난 시간을 4자리로 넣거나, '시간 모름'을 골라 주세요. 예: 0930"); return; }
  if (!g) { showError("성별을 골라 주세요."); return; }
  var s = { birth12: date + time, cal: cal, gender: g.value, timeUnknown: noTime };
  if (run(s)) Site.remember(s);
});

el("again").addEventListener("click", function () {
  el("result").hidden = true;
  el("formCard").hidden = false;
  window.scrollTo(0, 0);
});

// 저장된 생일이 있으면 미리 채우고, 주소에 #result 가 있으면 바로 결과를 보여 줍니다.
(function () {
  var s = Site.recall();
  if (!s || !s.birth12) return;
  el("bdate").value = s.birth12.slice(0, 8);
  if (s.timeUnknown) { el("noTime").checked = true; el("btime").disabled = true; }
  else el("btime").value = s.birth12.slice(8, 12);
  var c = document.querySelector('input[name="cal"][value="' + s.cal + '"]'); if (c) c.checked = true;
  var g = document.querySelector('input[name="gender"][value="' + s.gender + '"]'); if (g) g.checked = true;
  if (location.hash === "#result") run(s);
})();
</script>
</body>
</html>
