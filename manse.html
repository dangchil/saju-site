<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>만세력 · 사주 노트</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="home">
<main class="app">
  <header class="topbar"><a class="back" href="index.html" aria-label="홈으로">‹</a><h1>만세력</h1></header>

  <!-- 입력 -->
  <section class="card" id="formCard">
    <div class="error" id="errorBox" hidden></div>
    <form id="birthForm" autocomplete="off">
      <label class="field" for="birth12">생년월일시</label>
      <input type="tel" id="birth12" inputmode="numeric" maxlength="12" placeholder="예: 200708031800">
      <div class="hint">12자리 숫자로 넣어 주세요. 시각은 24시간제입니다 (오후 6시는 1800).</div>

      <label class="field">양력 · 음력 · 윤달</label>
      <div class="seg">
        <label><input type="radio" name="cal" value="양력" checked><span>양력</span></label>
        <label><input type="radio" name="cal" value="음력"><span>음력</span></label>
        <label><input type="radio" name="cal" value="윤달"><span>윤달</span></label>
      </div>

      <label class="field">성별</label>
      <div class="seg">
        <label><input type="radio" name="gender" value="남"><span>남</span></label>
        <label><input type="radio" name="gender" value="여"><span>여</span></label>
      </div>

      <button class="btn" type="submit">만세력 보기</button>
    </form>
  </section>

  <!-- 결과 -->
  <div id="result" hidden>
    <p class="muted small" id="summary"></p>

    <section class="card">
      <h2>원국</h2>
      <p class="caption">천간십성 · 천간 · 지지 · 지지십성 · 지장간 · 십이운성</p>
      <div class="table-wrap" id="natal"></div>
      <div class="legend" id="saryeongNote"></div>
    </section>

    <section class="card">
      <h2>대운</h2>
      <p class="caption" id="daeunCaption"></p>
      <div class="strip" id="daeunStrip" role="list"></div>
      <div class="seun-panel" id="seunPanel" hidden>
        <p class="caption" id="seunCaption"></p>
        <div class="strip" id="seunStrip"></div>
      </div>
    </section>

    <section class="card">
      <h2>세운</h2>
      <p class="caption">올해를 가운데 두고 앞뒤 다섯 해씩 보여 드립니다.</p>
      <div class="strip" id="yearStrip"></div>
    </section>

    <!-- 풀이: data/ 폴더의 파일에서 읽어 옵니다 -->
    <section class="card">
      <h2>나의 일간</h2>
      <div id="readIlgan"></div>
    </section>
    <section class="card">
      <h2>원국의 지지</h2>
      <div id="readJiji"></div>
    </section>
    <section class="card">
      <h2>원국에 있는 십성</h2>
      <div id="readSipsung"></div>
    </section>

    <button class="btn ghost" type="button" id="again">다시 입력하기</button>
  </div>
</main>

<script src="js/manse.js"></script>
<script src="js/saju-extra.js"></script>
<script src="js/common.js"></script>
<script>
var ORDER = ["시", "일", "월", "년"];
var THIS_YEAR = todayKST().y;

function el(id) { return document.getElementById(id); }
function stemElemOf(han) { return S_ELEM[S_HA.indexOf(han)]; }
// 가로 띠 안에서 "지금" 칸이 가운데 오도록 옆으로만 밀어 줍니다 (화면 전체는 움직이지 않음).
function centerNow(strip) {
  var cur = strip.querySelector(".lun.now");
  if (cur) strip.scrollLeft = cur.offsetLeft - strip.offsetLeft - (strip.clientWidth - cur.offsetWidth) / 2;
}

// ---- 원국 표 ----
function renderNatal(natal, sar) {
  function row(label, fn) {
    return '<tr><td class="lab">' + label + "</td>" + ORDER.map(fn).join("") + "</tr>";
  }
  var h = '<table class="saju"><tr><th></th>' + ORDER.map(function (l) { return "<th>" + l + "주</th>"; }).join("") + "</tr>";
  h += row("천간십성", function (l) { return '<td class="sib">' + natal[l].ten_stem + "</td>"; });
  h += row("천간", function (l) {
    return '<td class="' + (l === "일" ? "dm" : "") + '">' + Site.chip(natal[l].stem_han, natal[l].stem_elem) +
      '<span class="ko">' + natal[l].stem_ko + "</span></td>";
  });
  h += row("지지", function (l) {
    return "<td>" + Site.chip(natal[l].branch_han, natal[l].branch_elem) + '<span class="ko">' + natal[l].branch_ko + "</span></td>";
  });
  h += row("지지십성", function (l) { return '<td class="sib">' + natal[l].ten_branch + "</td>"; });
  h += row("지장간", function (l) {
    var chars = natal[l].hidden.split("");
    return '<td><span class="hidden-list">' + chars.map(function (ch, i) {
      var c = Site.chip(ch, stemElemOf(ch), "sm");
      if (l === "월" && i === sar.index) c = c.replace('class="chip ', 'class="chip saryeong ').replace("<span ", '<span title="사령" ');
      return c;
    }).join("") + "</span></td>";
  });
  h += row("십이운성", function (l) { return '<td class="sib">' + natal[l].stage + "</td>"; });
  h += "</table>";
  el("natal").innerHTML = h;

  var day = Math.floor(sar.days) + 1;
  el("saryeongNote").innerHTML = Site.chip(S_HA[sar.stem], S_ELEM[sar.stem], "sm saryeong") +
    "<span>월지 지장간에서 테두리를 두른 글자가 사령입니다. " + sar.jeol + " 절입 후 " + day + "일째에 태어나 " +
    S_KO[sar.stem] + "(" + S_HA[sar.stem] + ")" + Site.josa(S_KO[sar.stem], "이", "가") + " 사령입니다.</span>";
}

// ---- 대운·세운 칸 하나 ----
function lunCard(o, top, opts) {
  opts = opts || {};
  var tag = opts.button ? "button" : "div";
  return "<" + tag + ' class="lun' + (opts.now ? " now" : "") + '"' +
    (opts.button ? ' type="button" data-idx="' + opts.idx + '" aria-expanded="false"' : "") + ' role="listitem">' +
    '<div class="top">' + top + "</div>" +
    '<div class="sib">' + o.ten_stem + "</div>" +
    '<div class="gj">' + Site.chip(o.stem_han, o.stem_elem) + Site.chip(o.branch_han, o.branch_elem) + "</div>" +
    '<div class="sib">' + o.ten_branch + "</div>" +
    '<div class="st">' + o.stage + "</div>" +
    (opts.now ? '<span class="badge">지금</span>' : "") +
    "</" + tag + ">";
}

var daeun = [];

function renderDaeun(data) {
  daeun = data.daeun;
  el("daeunCaption").textContent = data.direction + " · 대운수 " + data.daeun_num + " · 대운을 누르면 그 안의 세운 열 해가 아래에 펼쳐집니다.";
  // 원본 만세력처럼 나이 많은 대운이 왼쪽, 어린 대운이 오른쪽에 옵니다.
  var html = "";
  for (var i = daeun.length - 1; i >= 0; i--) {
    var d = daeun[i];
    var now = d.year_from <= THIS_YEAR && THIS_YEAR <= d.year_to;
    html += lunCard(d, d.age + "세", { button: true, idx: i, now: now });
  }
  el("daeunStrip").innerHTML = html;
  el("seunPanel").hidden = true;
  centerNow(el("daeunStrip"));
}

function toggleDaeun(idx) {
  var btns = el("daeunStrip").querySelectorAll(".lun");
  var target = el("daeunStrip").querySelector('.lun[data-idx="' + idx + '"]');
  var wasOpen = target.classList.contains("selected");
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove("selected"); btns[i].setAttribute("aria-expanded", "false"); }
  if (wasOpen) { el("seunPanel").hidden = true; return; }
  target.classList.add("selected");
  target.setAttribute("aria-expanded", "true");

  var d = daeun[idx];
  el("seunCaption").textContent = d.age + "세 대운 (" + d.year_from + "~" + d.year_to + "년) 안의 세운";
  var html = "";
  for (var k = d.seun.length - 1; k >= 0; k--) {
    var s = d.seun[k];
    html += lunCard(s, s.year, { now: s.year === THIS_YEAR });
  }
  el("seunStrip").innerHTML = html;
  el("seunPanel").hidden = false;
  centerNow(el("seunStrip"));
}

el("daeunStrip").addEventListener("click", function (e) {
  var b = e.target.closest(".lun");
  if (b) toggleDaeun(Number(b.getAttribute("data-idx")));
});

// ---- 올해 앞뒤 세운 ----
function renderYears(ds) {
  var html = "";
  for (var y = THIS_YEAR + 5; y >= THIS_YEAR - 5; y--) {
    var o = ManseEngine.mod(y - 4, 10), b = ManseEngine.mod(y - 4, 12);
    html += lunCard(cell(ds, o, b), y, { now: y === THIS_YEAR });
  }
  el("yearStrip").innerHTML = html;
  centerNow(el("yearStrip"));
}

// ---- 풀이 (data/ 파일) ----
function renderReadings(natal) {
  var dayStem = natal["일"].stem_ko;
  Site.loadData("ilgan").then(function (d) {
    var box = el("readIlgan"); box.innerHTML = "";
    box.appendChild(Site.readingBlock(dayStem + "(" + natal["일"].stem_han + ") 일간", Site.textOf(d, dayStem), "data/ilgan.json"));
  });
  Site.loadData("jiji").then(function (d) {
    var box = el("readJiji"); box.innerHTML = "";
    ["년", "월", "일", "시"].forEach(function (l) {
      var b = natal[l].branch_ko;
      box.appendChild(Site.readingBlock(l + "지 " + b + "(" + natal[l].branch_han + ")", Site.textOf(d, b), "data/jiji.json"));
    });
  });
  Site.loadData("sipsung").then(function (d) {
    var box = el("readSipsung"); box.innerHTML = "";
    var seen = [];
    ["년", "월", "일", "시"].forEach(function (l) {
      [natal[l].ten_stem, natal[l].ten_branch].forEach(function (t) {
        if (t !== "일간" && seen.indexOf(t) < 0) seen.push(t);
      });
    });
    var TEN_ORDER = ["비견", "겁재", "식신", "상관", "편재", "정재", "편관", "정관", "편인", "정인"];
    seen.sort(function (a, b) { return TEN_ORDER.indexOf(a) - TEN_ORDER.indexOf(b); });
    seen.forEach(function (t) { box.appendChild(Site.readingBlock(t, Site.textOf(d, t), "data/sipsung.json")); });
  });
}

// ---- 입력 처리 ----
function showError(msg) { el("errorBox").textContent = msg; el("errorBox").hidden = false; }

function run(birth12, cal, gender) {
  var r;
  try { r = computeChart(birth12, cal, gender); } catch (err) { showError(err.message); return false; }
  var data = r.data;
  el("summary").textContent = "입력 " + data.input + " → 양력 " + data.solar + " · " + data.gender + " · 절기 " + data.jeol;
  renderNatal(data.natal, r.saryeong);
  renderDaeun(data);
  renderYears(r.sj.d[0]);
  renderReadings(data.natal);
  el("formCard").hidden = true;
  el("result").hidden = false;
  centerNow(el("daeunStrip"));
  centerNow(el("yearStrip"));
  window.scrollTo(0, 0);
  return true;
}

el("birthForm").addEventListener("submit", function (e) {
  e.preventDefault();
  el("errorBox").hidden = true;
  var birth12 = el("birth12").value.trim();
  var cal = document.querySelector('input[name="cal"]:checked').value;
  var g = document.querySelector('input[name="gender"]:checked');
  if (!birth12) { showError("생년월일시를 넣어 주세요."); return; }
  if (!g) { showError("성별을 골라 주세요."); return; }
  if (run(birth12, cal, g.value)) Site.remember({ birth12: birth12, cal: cal, gender: g.value });
});

el("again").addEventListener("click", function () {
  el("result").hidden = true;
  el("formCard").hidden = false;
  window.scrollTo(0, 0);
});

// 지난번 입력값을 미리 채워 둡니다.
(function () {
  var last = Site.recall();
  if (!last) return;
  el("birth12").value = last.birth12 || "";
  var c = document.querySelector('input[name="cal"][value="' + last.cal + '"]'); if (c) c.checked = true;
  var g = document.querySelector('input[name="gender"][value="' + last.gender + '"]'); if (g) g.checked = true;
})();
</script>
</body>
</html>
