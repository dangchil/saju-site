<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<link rel="icon" href="images/mascot.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261004.3">
<title>평생 사주 해설 · 사주 노트</title>
</head>
<body data-tab="home">
<main class="app">
  <header class="topbar">
    <a class="icon-btn plain" href="index.html" aria-label="홈으로" data-icon="back"></a>
    <h1>평생 사주 해설</h1>
    <span class="tag later">미리보기</span>
  </header>

  <!-- 표지 -->
  <section class="card butter cover">
    <img class="mascot xl" data-mascot alt="" style="margin:0 auto">
    <h2 id="coverTitle">나의 일주 이야기</h2>
    <p class="muted" id="coverBirth" style="margin:0"></p>
    <div id="coverCta"></div>
  </section>

  <!-- 목차 -->
  <section class="card">
    <h2>목차</h2>
    <ol class="toc">
      <li><span class="no">1</span><span class="tt">타고난 기질</span><span class="tag accent">무료 미리보기</span></li>
      <li class="locked"><span class="no">2</span><span class="tt">일과 재물</span><span data-icon="lock"></span></li>
      <li class="locked"><span class="no">3</span><span class="tt">사람과 관계</span><span data-icon="lock"></span></li>
      <li class="locked"><span class="no">4</span><span class="tt">대운의 흐름</span><span data-icon="lock"></span></li>
      <li class="locked"><span class="no">5</span><span class="tt">지금 나에게 필요한 것</span><span data-icon="lock"></span></li>
    </ol>
  </section>

  <!-- 1장 미리보기 (data/report.json) -->
  <section class="card">
    <span class="tag accent">1장 미리보기</span>
    <h2 style="margin-top:10px">타고난 기질</h2>
    <div id="chapter1"></div>
    <button class="btn" type="button" disabled>전체 해설 보기 · 곧 열려요</button>
  </section>

  <!-- 만드는 과정 -->
  <h2 class="section-title">이 해설은 이렇게 만들어져요</h2>
  <section class="card">
    <ol class="steps">
      <li><span class="no">1</span><span>검증한 만세력이 원국과 대운을 계산해요</span></li>
      <li><span class="no">2</span><span>교수가 직접 쓴 풀이 원칙을 적용해요</span></li>
      <li><span class="no">3</span><span>캐릭터가 쉬운 말로 풀어 전해요</span></li>
    </ol>
  </section>
</main>
<script src="js/manse.js?v=20261004"></script>
<script src="js/saju-extra.js?v=20261004"></script>
<script src="js/common.js?v=20261004"></script>
<script>
function el(id) { return document.getElementById(id); }
(function () {
  var s = Site.recall();
  if (!s || !s.birth12) {
    el("coverBirth").textContent = "만세력에서 생일을 넣으면 나의 일주로 해설을 보여 드려요.";
    el("coverCta").innerHTML = '<a class="btn" href="manse.html">생일 넣으러 가기</a>';
    el("chapter1").appendChild(Site.readingBlock("", Site.PENDING, ""));
    return;
  }
  var data;
  try { data = chartData(s.birth12, s.cal, s.gender || "남"); }
  catch (err) { el("coverBirth").textContent = err.message; return; }
  var d = data.natal["일"];
  el("coverTitle").textContent = d.stem_ko + d.branch_ko + "(" + d.stem_han + d.branch_han + ")일주의 이야기";
  el("coverBirth").textContent = Site.birthLine(s);
  el("coverCta").innerHTML = '<a class="text-link" href="manse.html">생일 바꾸기</a>';
  Site.loadData("report").then(function (r) {
    el("chapter1").appendChild(Site.readingBlock(d.stem_ko + "(" + d.stem_han + ") 일간", Site.textOf(r, d.stem_ko), "data/report.json"));
  });
})();
</script>
</body>
</html>
