<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<link rel="icon" href="images/mascot.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261004">
<title>오늘의 일진 · 사주 노트</title>
</head>
<body data-tab="iljin">
<main class="app">
  <header class="topbar">
    <img class="mascot" data-mascot alt="" style="width:40px;height:40px">
    <h1>오늘의 일진</h1>
  </header>

  <!-- 오늘 -->
  <section class="card lilac day-hero">
    <div class="date" id="todayDate"></div>
    <div class="chips" id="todayChips"></div>
    <div class="gj-name" id="todayName"></div>
    <div class="muted" id="todayElem"></div>
    <div id="readIlju" style="text-align:left;margin-top:12px"></div>
  </section>

  <!-- 나에게 오늘은 -->
  <section class="card">
    <div class="talk">
      <img class="mascot" data-mascot alt="">
      <p class="bubble" style="background:var(--lilac-bg)">내 일간으로 보면 오늘은 이런 날이에요</p>
    </div>
    <div id="mine"></div>
  </section>

  <!-- 이번 주 -->
  <h2 class="section-title">이번 주 일진</h2>
  <section class="card" style="padding:14px 10px">
    <div class="week" id="week"></div>
  </section>

  <p class="note">일진은 그날의 간지가 내 일간과 어떤 관계인지 보는 것이에요. 좋은 날, 나쁜 날을 가르기보다 하루의 결을 살피는 데 써 주세요.</p>
</main>

<script src="js/manse.js?v=20261004"></script>
<script src="js/saju-extra.js?v=20261004"></script>
<script src="js/common.js?v=20261004"></script>
<script>
function el(id) { return document.getElementById(id); }
var ELEM_NAME = ["목", "화", "토", "금", "수"], ELEM_HAN = ["木", "火", "土", "金", "水"];
var WEEK = "일월화수목금토";

var T = todayKST();
var TP = dayPillar(T.y, T.m, T.d);   // [천간, 지지]
function weekdayOf(y, m, d) { return WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; }

// ---- 오늘 ----
var todayName = S_KO[TP[0]] + B_KO[TP[1]];
el("todayDate").textContent = T.y + "년 " + T.m + "월 " + T.d + "일 " + weekdayOf(T.y, T.m, T.d) + "요일";
el("todayChips").innerHTML = Site.chip(S_HA[TP[0]], S_ELEM[TP[0]], "lg") + Site.chip(B_HA[TP[1]], B_ELEM[TP[1]], "lg");
el("todayName").textContent = todayName + "(" + S_HA[TP[0]] + B_HA[TP[1]] + ")일";
var e1 = ELEM_NAME[S_ELEM[TP[0]]], e2 = ELEM_NAME[B_ELEM[TP[1]]];
el("todayElem").textContent = e1 + "(" + ELEM_HAN[S_ELEM[TP[0]]] + ")" + Site.josa(e1, "과", "와") + " " +
  e2 + "(" + ELEM_HAN[B_ELEM[TP[1]]] + ")의 기운이 만나는 날";
Site.loadData("ilju").then(function (d) {
  el("readIlju").appendChild(Site.readingBlock(todayName + "일", Site.textOf(d, todayName), "data/ilju.json"));
});

// ---- 나에게 오늘은 (만세력에서 저장한 생일을 씁니다) ----
(function () {
  var s = Site.recall(), box = el("mine");
  if (!s || !s.birth12) {
    box.innerHTML = '<p class="muted" style="margin:14px 0 0">만세력에서 생일을 넣으면 오늘이 나에게 어떤 날인지 보여 드려요.</p>' +
      '<a class="btn" href="manse.html">생일 넣으러 가기</a>';
    return;
  }
  var data;
  try { data = chartData(s.birth12, s.cal, s.gender || "남"); }
  catch (err) { box.innerHTML = '<p class="error"></p>'; box.firstChild.textContent = err.message; return; }
  var my = S_HA.indexOf(data.natal["일"].stem_han);
  var tenS = tenGod(my, TP[0]), tenB = tenGod(my, B_MAIN[TP[1]]);

  box.innerHTML =
    '<div class="saved-line"><span>' + Site.birthLine(s) + '</span><a class="text-link" href="manse.html">바꾸기</a></div>' +
    '<p class="muted" style="margin:10px 2px 0;font-size:14px">내 일간 ' + S_KO[my] + "(" + S_HA[my] + ") 기준</p>" +
    '<div class="pair">' +
      '<div class="box"><div class="lab">오늘 천간</div><div class="flow">' + Site.chip(S_HA[TP[0]], S_ELEM[TP[0]]) + Site.icon("arrow") +
        '<span class="ten">' + tenS + "</span></div></div>" +
      '<div class="box"><div class="lab">오늘 지지</div><div class="flow">' + Site.chip(B_HA[TP[1]], B_ELEM[TP[1]]) + Site.icon("arrow") +
        '<span class="ten">' + tenB + "</span></div></div>" +
    "</div>" +
    '<div id="readIljin"></div>';
  Site.loadData("iljin").then(function (d) {
    el("readIljin").appendChild(Site.readingBlock("오늘이 나에게 " + tenS + "인 날", Site.textOf(d, tenS), "data/iljin.json"));
  });
})();

// ---- 이번 주 일진: 오늘부터 7일 ----
(function () {
  var html = "";
  for (var i = 0; i < 7; i++) {
    var dt = new Date(Date.UTC(T.y, T.m - 1, T.d + i));
    var y = dt.getUTCFullYear(), m = dt.getUTCMonth() + 1, d = dt.getUTCDate();
    var p = dayPillar(y, m, d);
    html += '<div class="d' + (i === 0 ? " today" : "") + '"' + (i === 0 ? ' aria-current="date"' : "") + ">" +
      '<div class="w">' + (i === 0 ? "오늘" : WEEK[dt.getUTCDay()]) + "</div>" +
      '<div class="n">' + m + "/" + d + "</div>" +
      '<div class="c">' + Site.chip(S_HA[p[0]], S_ELEM[p[0]], "sm") + Site.chip(B_HA[p[1]], B_ELEM[p[1]], "sm") + "</div></div>";
  }
  el("week").innerHTML = html;
})();
</script>
</body>
</html>
